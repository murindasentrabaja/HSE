<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HSE ERP — Sistem Manajemen HSE Terintegrasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --brand:#1e40af; --brand-2:#2563eb; --safety:#10b981; --safety-dark:#059669;
    --danger:#dc2626; --warn:#f59e0b; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --bg:#f8fafc; --card:#ffffff;
  }
  *{font-family:'Plus Jakarta Sans',sans-serif;}
  body{background:var(--bg);color:var(--ink);}
  .brand-grad{background:linear-gradient(135deg,#1e40af 0%,#2563eb 55%,#10b981 130%);}
  .side-item{transition:all .15s ease}
  .side-item:hover{background:#eff6ff;color:var(--brand)}
  .side-item.active{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(30,64,175,.25)}
  .kpi-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;transition:transform .2s}
  .kpi-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.06)}
  .badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:9999px;font-size:11px;font-weight:600}
  .b-green{background:#dcfce7;color:#166534}
  .b-red{background:#fee2e2;color:#991b1b}
  .b-yellow{background:#fef3c7;color:#92400e}
  .b-blue{background:#dbeafe;color:#1e40af}
  .b-gray{background:#f1f5f9;color:#475569}
  table.data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  table.data-table thead th{background:#f1f5f9;text-align:left;padding:10px 12px;font-weight:600;color:#334155;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:10}
  table.data-table tbody td{padding:10px 12px;border-bottom:1px solid #f1f5f9;color:#334155;white-space:nowrap}
  table.data-table tbody tr:hover{background:#f8fafc}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;transition:all .15s;cursor:pointer;border:none}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:#1e3a8a}
  .btn-safety{background:var(--safety);color:#fff}
  .btn-safety:hover{background:var(--safety-dark)}
  .btn-ghost{background:#fff;color:#334155;border:1px solid var(--line)}
  .btn-ghost:hover{background:#f1f5f9}
  .btn-danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .btn-danger:hover{background:#fee2e2}
  .input,.select,.textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
  .input:focus,.select:focus,.textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px}
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-backdrop.open{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .toast{position:fixed;top:20px;right:20px;padding:14px 18px;border-radius:10px;color:#fff;font-weight:600;font-size:13px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.15);animation:slideIn .25s ease}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
  .grain{position:relative}
  .grain::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 1px,transparent 1px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
  .scroll-thin::-webkit-scrollbar{width:8px;height:8px}
  .scroll-thin::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .risk-Rendah{background:#dcfce7;color:#166534}
  .risk-Sedang{background:#fef3c7;color:#92400e}
  .risk-Tinggi{background:#fed7aa;color:#9a3412}
  .risk-Sangat.Tinggi,.risk-SangatTinggi{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginView" class="min-h-screen flex items-center justify-center p-6 brand-grad grain">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-12 h-12 rounded-xl brand-grad flex items-center justify-center text-white text-xl"><i class="fa-solid fa-helmet-safety"></i></div>
      <div>
        <h1 class="text-xl font-extrabold text-slate-900">HSE ERP</h1>
        <p class="text-xs text-slate-500">Sistem Manajemen K3 Terintegrasi</p>
      </div>
    </div>
    <h2 class="text-2xl font-bold text-slate-900 mb-1">Masuk ke Sistem</h2>
    <p class="text-sm text-slate-500 mb-6">Gunakan akun yang terdaftar di sheet Users</p>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="label">Username</label>
        <input class="input" id="lgUser" placeholder="admin" required data-testid="login-username" />
      </div>
      <div>
        <label class="label">Password</label>
        <input type="password" class="input" id="lgPass" placeholder="••••••••" required data-testid="login-password" />
      </div>
      <div id="lgErr" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3"></div>
      <button type="submit" class="btn btn-primary w-full justify-center" data-testid="login-submit">
        <i class="fa-solid fa-right-to-bracket"></i> Masuk
      </button>
    </form>
    <div class="mt-5 text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg p-3">
      <strong>Default:</strong> admin / admin123 <br>
      Jika belum bisa login, buka Apps Script → jalankan <code class="bg-white px-1 rounded">initAll()</code>
    </div>
  </div>
</div>

<!-- ===== APP SHELL ===== -->
<div id="appView" class="hidden min-h-screen flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col h-screen sticky top-0">
    <div class="p-5 border-b border-slate-200 flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg brand-grad flex items-center justify-center text-white"><i class="fa-solid fa-helmet-safety"></i></div>
      <div>
        <div class="font-extrabold text-slate-900 text-sm">HSE ERP</div>
        <div class="text-[10px] text-slate-500 uppercase tracking-widest">Realtime Sheet</div>
      </div>
    </div>
    <nav id="sidebar" class="flex-1 overflow-y-auto scroll-thin p-3 space-y-1 text-sm"></nav>
    <div class="p-3 border-t border-slate-200">
      <div class="flex items-center gap-3 mb-3 px-2">
        <div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 font-bold" id="userAvatar">A</div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-slate-900 truncate" id="userName">-</div>
          <div class="text-[11px] text-slate-500 truncate" id="userRole">-</div>
        </div>
      </div>
      <button class="btn btn-ghost w-full justify-center" onclick="logout()" data-testid="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i> Keluar
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
      <div>
        <h1 class="text-lg font-bold text-slate-900" id="pageTitle">Dashboard</h1>
        <p class="text-xs text-slate-500" id="pageSub">Ringkasan indikator kinerja HSE</p>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost" onclick="refreshCurrent()" data-testid="refresh-btn"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
        <button class="btn btn-ghost hidden" id="exportXlsxBtn" onclick="exportXlsx()"><i class="fa-solid fa-file-excel text-emerald-600"></i> Excel</button>
        <button class="btn btn-ghost hidden" id="exportPdfBtn" onclick="exportPdf()"><i class="fa-solid fa-file-pdf text-red-600"></i> PDF</button>
        <button class="btn btn-safety hidden" id="addBtn" onclick="openForm(null)" data-testid="add-btn"><i class="fa-solid fa-plus"></i> Tambah</button>
      </div>
    </header>

    <section id="content" class="flex-1 p-6 overflow-auto scroll-thin"></section>
  </main>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
      <h3 class="font-bold text-slate-900" id="modalTitle">Form</h3>
      <button onclick="closeForm()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div class="p-6 overflow-y-auto scroll-thin flex-1" id="modalBody"></div>
    <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-2 bg-slate-50">
      <button class="btn btn-ghost" onclick="closeForm()">Batal</button>
      <button class="btn btn-primary" onclick="saveForm()" data-testid="save-btn"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   HSE ERP FRONTEND
   Ganti BACKEND_URL dengan URL Web App Google Apps Script Anda.
   ================================================================ */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyb0DEAUziRswV1wJoIVmOjq9Yw-mKs2iWv9qBMm9xzMZafkX2eRjuLZ6FSyXGbsMUwMw/exec'; // <-- ganti setelah deploy Code.gs

/* ------- Modul definisi ------- */
const MODULES = [
  { group:'Dashboard', items:[
    { id:'dashboard', label:'Dashboard', icon:'chart-line' }
  ]},
  { group:'Master Data', items:[
    { id:'Karyawan', label:'Karyawan', icon:'user-tie' },
    { id:'Departemen', label:'Departemen', icon:'building' },
    { id:'Jabatan', label:'Jabatan', icon:'id-card' },
    { id:'AreaKerja', label:'Area Kerja', icon:'location-dot' },
    { id:'Alat', label:'Alat/Equipment', icon:'gears' },
    { id:'APD', label:'APD', icon:'shield-halved' },
    { id:'BahanKimia', label:'Bahan Kimia', icon:'flask-vial' },
    { id:'Kontraktor', label:'Kontraktor', icon:'handshake' },
  ]},
  { group:'Risiko & Perencanaan', items:[
    { id:'HIRADC', label:'HIRADC', icon:'triangle-exclamation' },
    { id:'JSA', label:'Job Safety Analysis', icon:'clipboard-list' },
    { id:'IzinKerja', label:'Izin Kerja (PTW)', icon:'file-signature' },
  ]},
  { group:'Insiden & Investigasi', items:[
    { id:'Insiden', label:'Laporan Insiden', icon:'bell' },
    { id:'Investigasi', label:'Investigasi', icon:'magnifying-glass' },
  ]},
  { group:'Inspeksi', items:[
    { id:'InspeksiAPD', label:'Inspeksi APD', icon:'circle-check' },
    { id:'InspeksiAlat', label:'Inspeksi Alat', icon:'screwdriver-wrench' },
    { id:'InspeksiAPAR', label:'Inspeksi APAR', icon:'fire-extinguisher' },
  ]},
  { group:'People & Health', items:[
    { id:'TransaksiAPD', label:'Transaksi APD', icon:'box-open' },
    { id:'Pelatihan', label:'Pelatihan', icon:'graduation-cap' },
    { id:'Medical', label:'Pemeriksaan Medis', icon:'stethoscope' },
  ]},
  { group:'Lingkungan', items:[
    { id:'Limbah', label:'Manifest Limbah', icon:'trash-can' },
    { id:'Monitoring', label:'Monitoring Lingkungan', icon:'leaf' },
  ]},
  { group:'Governance', items:[
    { id:'Rapat', label:'Rapat', icon:'users' },
    { id:'Audit', label:'Audit', icon:'file-shield' },
    { id:'Drill', label:'Emergency Drill', icon:'people-arrows' },
    { id:'Users', label:'Users', icon:'user-shield' },
  ]},
];

/* Field mapping enum untuk auto-dropdown */
const FIELD_ENUM_MAP = {
  'Role':'Role','Status':'StatusAktif','Jenis Kelamin':'JenisKelamin','Golongan Darah':'GolonganDarah',
  'Status Karyawan':'StatusKaryawan','Level Risiko Jabatan':'LevelRisiko','Level Risiko':'LevelRisiko',
  'Jenis Bahaya Utama':'JenisBahaya','Kategori Bahaya':'JenisBahaya','Status Alat':'StatusAlat',
  'Kondisi':'KondisiInspeksi','Kondisi Umum':'KondisiInspeksi','Kondisi Fisik':'KondisiFisikAPAR',
  'Klasifikasi Bahaya':'KlasifikasiBahayaKimia','Wujud':'WujudBahan','Aktivitas Pekerjaan':'AktivitasKerja',
  'Hirarki Pengendalian':'HirarkiPengendalian','Jenis Insiden':'JenisInsiden','Bagian Tubuh Cedera':'BagianTubuh',
  'Penyebab Langsung':'PenyebabLangsung','Status Investigasi':'StatusInvestigasi','Dibawa ke RS':'YaTidak',
  'Isi Ulang':'YaTidak','Jenis Izin':'JenisIzinKerja','Alasan':'AlasanAPD','Hasil':'HasilPelatihan',
  'Jenis Pemeriksaan':'JenisPemeriksaanMedis','Hasil Umum':'HasilMedis','Jenis Limbah':'JenisLimbah',
  'Satuan':'SatuanLimbah','Parameter':'ParameterLingkungan','Jenis Audit':'JenisAudit',
  'Kategori Temuan':'KategoriTemuan','Jenis Drill':'JenisDrill','Evaluasi':'HasilEvaluasi',
};
const FIELD_REF_MAP = {
  'Departemen':'Departemen','Kepala Departemen':'Karyawan','Area Kerja':'AreaKerja',
  'Area/Departemen':'AreaKerja','Area Kejadian':'AreaKerja','Area Diaudit':'AreaKerja',
  'Nama Karyawan':'Karyawan','Nama Korban':'Karyawan','Nama Peserta':'Karyawan',
  'Kode Alat':'Alat','Jenis APD':'APD','Kontraktor':'Kontraktor','Jabatan':'Jabatan',
  'No Laporan Terkait':'Insiden'
};

/* State */
const state = { user:null, current:'dashboard', schema:{}, enums:{}, data:[], editingRow:null, cache:{}, statusMap:{}, dateField:null };
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const toast = (msg, type='success') => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.background = type==='error'?'#dc2626':type==='warn'?'#f59e0b':'#10b981';
  el.innerHTML = `<i class="fa-solid fa-${type==='error'?'circle-xmark':type==='warn'?'triangle-exclamation':'circle-check'}"></i> ${msg}`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
};

/* ------- Utility Tools ------- */
function isExpiryField(h){ return /berikutnya|berlaku sampai|masa berlaku|kadaluarsa/i.test(h); }
function isImageUrlField(h){ return /foto|ttd|tanda tangan|signature/i.test(h); }
function daysUntil(dateStr){ if(!dateStr) return null; const d=new Date(dateStr); if(isNaN(d)) return null; return Math.floor((d - new Date())/(1000*60*60*24)); }
function isLong(h){ return /Kronologi|Deskripsi|Langkah|Temuan|Rekomendasi|Notulen|Agenda|Skenario|Evaluasi|Tindakan|Pengendalian|Catatan|Faktor|Akar Masalah|Identifikasi|Potensi|Peserta/i.test(h); }
function isRequired(h,s){ return (state.schema[s]||[])[0] === h && !['Insiden','Investigasi','IzinKerja','InspeksiAPD','InspeksiAlat','InspeksiAPAR','TransaksiAPD','Pelatihan','Medical','Limbah','Monitoring','Rapat','Audit','Drill','HIRADC','JSA'].includes(s); }

/* ------- API helpers ------- */
async function apiGet(params) {
  const url = new URL(BACKEND_URL);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
  const r = await fetch(url.toString());
  return r.json();
}
async function apiPost(body) {
  // Use text/plain to avoid CORS preflight on Google Apps Script
  const r = await fetch(BACKEND_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body),
    redirect:'follow'
  });
  return r.json();
}

/* ------- Auth ------- */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (BACKEND_URL.includes('PASTE_WEB_APP_URL')) {
    $('#lgErr').classList.remove('hidden');
    $('#lgErr').textContent = 'BACKEND_URL belum diisi. Buka file HTML dan ganti URL Web App Anda.';
    return;
  }
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
  try {
    const res = await apiPost({ action:'login', username:$('#lgUser').value.trim(), password:$('#lgPass').value });
    if (!res.ok) throw new Error(res.msg);
    state.user = res.user;
    localStorage.setItem('hse_user', JSON.stringify(res.user));
    await bootApp();
  } catch(err) {
    $('#lgErr').classList.remove('hidden');
    $('#lgErr').textContent = err.message || 'Login gagal';
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk';
  }
});

function logout() {
  localStorage.removeItem('hse_user');
  state.user = null;
  $('#appView').classList.add('hidden');
  $('#loginView').classList.remove('hidden');
}

/* ------- Boot ------- */
async function bootApp() {
  $('#loginView').classList.add('hidden');
  $('#appView').classList.remove('hidden');
  $('#userName').textContent = state.user.name;
  $('#userRole').textContent = state.user.role + ' • ' + (state.user.dept||'');
  $('#userAvatar').textContent = (state.user.name||'U').charAt(0).toUpperCase();
  renderSidebar();
  // Load enums + schema in parallel
  const [en, sc] = await Promise.all([apiGet({action:'enums'}), apiGet({action:'schema'})]);
  state.enums = en.data || {}; state.schema = sc.data || {};
  navigate('dashboard');
}

function renderSidebar() {
  const sb = $('#sidebar'); sb.innerHTML = '';
  MODULES.forEach(g => {
    const grp = document.createElement('div');
    grp.innerHTML = `<div class="text-[10px] uppercase font-bold text-slate-400 px-3 pt-3 pb-1 tracking-wider">${g.group}</div>`;
    g.items.forEach(it => {
      const a = document.createElement('a');
      a.href = '#'; a.dataset.id = it.id;
      a.className = 'side-item flex items-center gap-3 px-3 py-2 rounded-lg text-slate-700 cursor-pointer';
      a.innerHTML = `<i class="fa-solid fa-${it.icon} w-4 text-center"></i><span>${it.label}</span>`;
      a.setAttribute('data-testid', 'nav-' + it.id.toLowerCase());
      a.onclick = e => { e.preventDefault(); navigate(it.id); };
      grp.appendChild(a);
    });
    sb.appendChild(grp);
  });
}

/* ------- Navigation ------- */
async function navigate(id) {
  state.current = id;
  $$('#sidebar .side-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const mod = findModule(id);
  $('#pageTitle').textContent = mod?.label || id;
  $('#pageSub').textContent = id==='dashboard' ? 'Ringkasan indikator kinerja HSE' : `Kelola data ${mod?.label||''} - tersimpan realtime ke Google Sheets`;
  $('#addBtn').classList.toggle('hidden', id==='dashboard');
  $('#exportXlsxBtn').classList.toggle('hidden', id==='dashboard');
  $('#exportPdfBtn').classList.toggle('hidden', id==='dashboard');

  if (id === 'dashboard') await renderDashboard();
  else await renderTable(id);
}

function findModule(id) {
  for (const g of MODULES) for (const it of g.items) if (it.id === id) return it;
  return null;
}

function refreshCurrent() { navigate(state.current); }

/* ------- Dashboard ------- */
async function renderDashboard() {
  const c = $('#content');
  c.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="kpi">
    ${['Karyawan Aktif','Insiden Tahun Ini','Izin Kerja Aktif','Alat Layak Operasi'].map(t=>`<div class="kpi-card"><div class="text-xs text-slate-500 font-semibold uppercase tracking-wider">${t}</div><div class="text-3xl font-extrabold text-slate-900 mt-2">—</div></div>`).join('')}
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="kpi-card lg:col-span-2"><div class="flex items-center justify-between mb-3"><h3 class="font-bold text-slate-900">Tren Insiden ${new Date().getFullYear()}</h3><span class="badge b-blue">Per bulan</span></div><canvas id="chIns" height="110"></canvas></div>
    <div class="kpi-card"><h3 class="font-bold text-slate-900 mb-3">Distribusi Level Risiko (HIRADC)</h3><canvas id="chRisk" height="180"></canvas></div>
    <div class="kpi-card"><h3 class="font-bold text-slate-900 mb-3">Jenis Insiden</h3><canvas id="chType" height="180"></canvas></div>
    <div class="kpi-card lg:col-span-2"><h3 class="font-bold text-slate-900 mb-3">Status Alat/Equipment</h3><canvas id="chAlat" height="110"></canvas></div>
  </div>`;

  try {
    const r = await apiGet({ action:'dashboard' });
    if (!r.ok) throw new Error(r.msg);
    const d = r.data;
    const kpis = ['#kpi > div:nth-child(1)','#kpi > div:nth-child(2)','#kpi > div:nth-child(3)','#kpi > div:nth-child(4)'];
    const vals = [d.totalKaryawan, d.insidenThnIni, d.izinAktif, `${d.alatLayak}/${d.totalAlat}`];
    kpis.forEach((s,i) => $(s).querySelector('.text-3xl').textContent = vals[i]);

    new Chart($('#chIns'), { type:'line', data:{ labels:['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'], datasets:[{ label:'Insiden', data:d.insidenByMonth, borderColor:'#1e40af', backgroundColor:'rgba(30,64,175,.12)', fill:true, tension:.35, borderWidth:2, pointRadius:4, pointBackgroundColor:'#10b981' }] }, options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{stepSize:1}}} }});
    new Chart($('#chRisk'), { type:'doughnut', data:{ labels:Object.keys(d.risikoDist), datasets:[{ data:Object.values(d.risikoDist), backgroundColor:['#10b981','#f59e0b','#f97316','#dc2626'], borderWidth:0 }] }, options:{ plugins:{legend:{position:'bottom',labels:{font:{size:11}}}} }});
    new Chart($('#chType'), { type:'polarArea', data:{ labels:Object.keys(d.insidenByType), datasets:[{ data:Object.values(d.insidenByType), backgroundColor:['#1e40af','#2563eb','#10b981','#f59e0b','#dc2626','#8b5cf6','#ec4899','#06b6d4'] }] }, options:{ plugins:{legend:{position:'bottom',labels:{font:{size:10}}}} }});
    new Chart($('#chAlat'), { type:'bar', data:{ labels:Object.keys(d.alatStatus), datasets:[{ label:'Jumlah', data:Object.values(d.alatStatus), backgroundColor:['#10b981','#f59e0b','#dc2626','#64748b'], borderRadius:6 }] }, options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{stepSize:1}}} }});
  } catch(err) {
    c.innerHTML += `<div class="mt-4 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">Gagal memuat dashboard: ${err.message}</div>`;
  }
}

/* ------- Table View & Filters ------- */
async function renderTable(sheet) {
  const c = $('#content');
  const headers = state.schema[sheet] || [];
  const dateField = headers.find(h => /^Tanggal/i.test(h)) || null;
  const dateFilterUI = dateField ? `
    <div class="flex items-center gap-2">
      <span class="text-xs font-semibold text-slate-500 uppercase">${dateField}:</span>
      <input type="date" class="input" style="width:150px" id="filterFrom" oninput="filterTable()" data-testid="filter-from"/>
      <span class="text-slate-400">—</span>
      <input type="date" class="input" style="width:150px" id="filterTo" oninput="filterTable()" data-testid="filter-to"/>
      <select class="select" style="width:120px" id="filterMonth" oninput="applyMonthFilter()" data-testid="filter-month">
        <option value="">Semua Bulan</option>
        ${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'].map((n,i)=>`<option value="${i}">${n}</option>`).join('')}
      </select>
      <button class="btn btn-ghost" onclick="clearDateFilter()" title="Reset filter tanggal"><i class="fa-solid fa-xmark"></i></button>
    </div>` : '';
  
  c.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
    <div class="p-4 border-b border-slate-200 flex items-center gap-3 flex-wrap">
      <div class="relative flex-1 min-w-[220px] max-w-md">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input class="input pl-9" id="searchInput" placeholder="Cari..." oninput="filterTable()" data-testid="search-input"/>
      </div>
      ${dateFilterUI}
      <div class="text-sm text-slate-500 ml-auto" id="tableCount">-</div>
    </div>
    <div class="overflow-auto scroll-thin" style="max-height:calc(100vh - 250px)"><table class="data-table" id="dt"><thead></thead><tbody></tbody></table></div>
  </div>`;
  
  state.dateField = dateField;

  const res = await apiGet({ action:'list', sheet });
  if (!res.ok) { toast(res.msg||'Gagal memuat', 'error'); return; }
  state.data = res.data || [];
  state.cache[sheet] = state.data;

  const visibleHeaders = headers.filter(h => h !== 'PasswordHash');
  const thead = $('#dt thead');
  thead.innerHTML = '<tr>' + visibleHeaders.map(h=>`<th>${h}</th>`).join('') + '<th style="width:100px">Aksi</th></tr>';
  renderRows(visibleHeaders);
}

function renderRows(headers) {
  const q = ($('#searchInput')?.value||'').toLowerCase();
  const df = state.dateField;
  const from = df ? $('#filterFrom')?.value : '';
  const to = df ? $('#filterTo')?.value : '';
  
  const rows = state.data.filter(r => {
    if (q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
    if (df && (from || to)) {
      const raw = r[df]; if (!raw) return false;
      const dv = new Date(raw); if (isNaN(dv)) return false;
      const ds = fmtDate(dv);
      if (from && ds < from) return false;
      if (to && ds > to) return false;
    }
    return true;
  });

  const tbody = $('#dt tbody');
  tbody.innerHTML = rows.map(r => {
    return '<tr>' + headers.map(h => {
      let v = r[h]; if (v instanceof Date) v = fmtDate(v);
      if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)) v = fmtDate(new Date(v));
      
      // Image URL / TTD -> thumbnail
      if (isImageUrlField(h) && v && /^https?:\/\//i.test(String(v))) {
        return `<td><a href="${v}" target="_blank"><img src="${v}" class="w-10 h-10 rounded object-cover border border-slate-200"/></a></td>`;
      }
      if (isImageUrlField(h) && v && String(v).startsWith('data:image')) {
        return `<td><img src="${v}" class="w-16 h-8 object-contain border border-slate-200 rounded bg-white"/></td>`;
      }
      
      // Expiry warning
      if (isExpiryField(h) && v) {
        const days = daysUntil(v);
        if (days !== null && days < 0) return `<td><span class="badge b-red" title="Kadaluarsa ${Math.abs(days)} hari lalu"><i class="fa-solid fa-circle-exclamation mr-1"></i>${v} • Expired</span></td>`;
        if (days !== null && days <= 30) return `<td><span class="badge b-yellow" title="Akan expired ${days} hari lagi"><i class="fa-solid fa-clock mr-1"></i>${v} • ${days}h lagi</span></td>`;
        return `<td><span class="badge b-green">${v}</span></td>`;
      }
      
      // Level Risiko badge
      if (h === 'Level Risiko' && v) return `<td><span class="badge risk-${String(v).replace(' ','')}">${v}</span></td>`;
      if (h === 'Status' || h === 'Status Alat' || h === 'Status Karyawan' || h === 'Status Investigasi' || h === 'Status Tindak Lanjut') {
        const cl = /aktif|layak|closed|selesai|memenuhi|lulus|fit\b|baik/i.test(String(v))?'b-green':/perlu|overdue|melebihi|unfit|open/i.test(String(v))?'b-red':/progress|sedang|draft/i.test(String(v))?'b-yellow':'b-gray';
        return `<td><span class="badge ${cl}">${v||'-'}</span></td>`;
      }
      return `<td>${v==null||v===''?'<span class="text-slate-300">—</span>':escapeHtml(String(v))}</td>`;
    }).join('') + `<td>
      <button class="text-blue-600 hover:text-blue-800 mr-2" onclick="openForm(${r._row})" title="Edit" data-testid="edit-${r._row}"><i class="fa-solid fa-pen"></i></button>
      <button class="text-red-600 hover:text-red-800" onclick="delRow(${r._row})" title="Hapus" data-testid="delete-${r._row}"><i class="fa-solid fa-trash"></i></button>
    </td></tr>`;
  }).join('');
  $('#tableCount').textContent = `${rows.length} dari ${state.data.length} data`;
}

function filterTable() { 
  const headers = (state.schema[state.current]||[]).filter(h=>h!=='PasswordHash'); 
  renderRows(headers); 
}

function applyMonthFilter() {
  const m = $('#filterMonth')?.value;
  if (m === '' || m == null) { $('#filterFrom').value=''; $('#filterTo').value=''; }
  else {
    const y = new Date().getFullYear();
    const from = new Date(y, Number(m), 1);
    const to = new Date(y, Number(m)+1, 0);
    $('#filterFrom').value = fmtDate(from);
    $('#filterTo').value = fmtDate(to);
  }
  filterTable();
}

function clearDateFilter() {
  if ($('#filterFrom')) $('#filterFrom').value = '';
  if ($('#filterTo')) $('#filterTo').value = '';
  if ($('#filterMonth')) $('#filterMonth').value = '';
  filterTable();
}

function fmtDate(d){ if(!(d instanceof Date)||isNaN(d))return ''; return d.toISOString().split('T')[0]; }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ------- Form Modal ------- */
async function openForm(row) {
  const sheet = state.current;
  const headers = (state.schema[sheet]||[]).filter(h => h !== 'PasswordHash');
  const existing = row ? state.data.find(r => r._row === row) : {};
  state.editingRow = row;
  $('#modalTitle').textContent = (row?'Edit ':'Tambah ') + (findModule(sheet)?.label||sheet);

  // Pre-load reference data
  const refSheets = [...new Set(headers.map(h => FIELD_REF_MAP[h]).filter(Boolean))];
  await Promise.all(refSheets.map(async s => {
    if (!state.cache[s]) {
      const r = await apiGet({ action:'list', sheet:s });
      if (r.ok) state.cache[s] = r.data;
    }
  }));

  const body = $('#modalBody');
  body.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' + headers.map(h => {
    const val = existing[h] != null ? existing[h] : '';
    const strVal = val instanceof Date ? fmtDate(val) : (typeof val==='string' && /^\d{4}-\d{2}-\d{2}T/.test(val) ? fmtDate(new Date(val)) : val);
    return `<div class="${isLong(h)?'md:col-span-2':''}"><label class="label">${h}${isRequired(h,sheet)?' <span class="text-red-500">*</span>':''}</label>${buildField(h, strVal, sheet)}</div>`;
  }).join('') + '</div>';
  
  _showModal(); // Buka modal di tahap akhir (menimpa default handler)
}

function closeForm() { 
  $('#modal').classList.remove('open'); 
  state.editingRow = null; 
}
document.getElementById('modal').classList.remove('open');

function buildField(header, val, sheet) {
  const id = 'f_' + header.replace(/[^a-zA-Z0-9]/g,'_');
  
  // Password field for Users
  if (sheet==='Users' && header==='PasswordHash') return '';
  if (sheet==='Users' && header==='Username' && state.editingRow) return `<input class="input" name="${header}" id="${id}" value="${escapeAttr(val)}" readonly />`;
  
  // Foto TKP / Upload gambar
  if (/^Foto /i.test(header) || header === 'Foto TKP') {
    const preview = val && /^https?:\/\//.test(String(val)) ? `<a href="${val}" target="_blank"><img src="${val}" class="w-24 h-24 object-cover rounded border border-slate-200 mb-2"/></a>` : '';
    return `<div>${preview}<input type="file" accept="image/*" class="input" id="${id}" data-upload="1" data-name="${header}" data-existing="${escapeAttr(val)}" /><input type="hidden" name="${header}" id="${id}_hidden" value="${escapeAttr(val)}"/></div>`;
  }
  
  // Tanda Tangan / TTD canvas
  if (/^TTD /i.test(header) || /tanda tangan|signature/i.test(header)) {
    const existing = val && String(val).startsWith('data:image') ? val : '';
    return `<div>
      <div class="border border-slate-300 rounded-lg bg-white" style="width:100%;max-width:360px">
        <canvas id="${id}_canvas" width="360" height="120" style="width:100%;height:120px;cursor:crosshair;touch-action:none" data-signature="1" data-name="${header}"></canvas>
      </div>
      <div class="flex gap-2 mt-2">
        <button type="button" class="btn btn-ghost" style="padding:5px 10px;font-size:11px" onclick="clearSig('${id}_canvas')"><i class="fa-solid fa-eraser"></i> Hapus</button>
        ${existing?`<button type="button" class="btn btn-ghost" style="padding:5px 10px;font-size:11px" onclick="loadSig('${id}_canvas','${existing}')"><i class="fa-solid fa-image"></i> Muat TTD lama</button>`:''}
      </div>
      <input type="hidden" name="${header}" id="${id}_hidden" value="${escapeAttr(existing)}"/>
    </div>`;
  }
  
  // Enum -> select
  const enumKey = FIELD_ENUM_MAP[header];
  if (enumKey && state.enums[enumKey]) {
    return `<select class="select" name="${header}" id="${id}"><option value="">-- Pilih --</option>${state.enums[enumKey].map(o=>`<option value="${o}" ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
  }
  
  // Reference -> select from cache
  const refKey = FIELD_REF_MAP[header];
  if (refKey && state.cache[refKey]) {
    const opts = state.cache[refKey].map(r => {
      const label = r['Nama Lengkap'] || r['Nama Departemen'] || r['Nama Area'] || r['Nama Alat'] || r['Nama APD'] || r['Nama Perusahaan'] || r['Nama Jabatan'] || r['No Laporan'] || r[Object.keys(r)[0]];
      const value = r['NIK'] || r['Kode Departemen'] || r['Kode Area'] || r['Kode Alat'] || r['Kode APD'] || r['Kode Kontraktor'] || r['Kode Jabatan'] || r['No Laporan'] || label;
      return { label, value };
    });
    return `<select class="select" name="${header}" id="${id}"><option value="">-- Pilih --</option>${opts.map(o=>`<option value="${o.value}" ${o.value==val||o.label==val?'selected':''}>${o.label}</option>`).join('')}</select>`;
  }
  
  // Password
  if (/password/i.test(header)) return `<input type="password" class="input" name="Password" id="${id}" placeholder="${state.editingRow?'(kosongkan jika tidak diganti)':'Password'}" />`;
  // Date
  if (/tanggal|masa berlaku|target|berlaku sampai/i.test(header)) return `<input type="date" class="input" name="${header}" id="${id}" value="${val||''}" />`;
  // Time
  if (/jam/i.test(header)) return `<input type="time" class="input" name="${header}" id="${id}" value="${val||''}" />`;
  // Number
  if (/severity|likelihood|jumlah|kapasitas|masa pakai|hari hilang|tahun|jumlah peserta|waktu evakuasi|tekanan/i.test(header)) {
    const max = /severity|likelihood/i.test(header) ? 5 : '';
    return `<input type="number" class="input" name="${header}" id="${id}" value="${val||''}" ${max?'max="'+max+'" min="1"':''} />`;
  }
  // Long text
  if (isLong(header)) return `<textarea class="textarea" rows="3" name="${header}" id="${id}">${escapeAttr(val)}</textarea>`;
  
  // Default
  return `<input class="input" name="${header}" id="${id}" value="${escapeAttr(val)}" />`;
}

function escapeAttr(v){ return String(v==null?'':v).replace(/"/g,'&quot;'); }

function _showModal(){ 
  $('#modal').classList.add('open'); 
  initSignatureCanvases(); 
}

/* ------- Signature Canvas ------- */
function initSignatureCanvases() {
  document.querySelectorAll('canvas[data-signature="1"]').forEach(canvas => {
    if (canvas.dataset.inited) return;
    canvas.dataset.inited = '1';
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    let drawing = false, last = null;
    
    const getPos = e => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - r.left) * (canvas.width/r.width), y: (t.clientY - r.top) * (canvas.height/r.height) };
    };
    const start = e => { e.preventDefault(); drawing = true; last = getPos(e); };
    const move = e => { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; canvas.dataset.dirty='1'; };
    const end = () => { drawing = false; };
    
    canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
    canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
    
    // Preload existing if hidden has data
    const hidden = document.getElementById(canvas.id.replace('_canvas','_hidden'));
    if (hidden && hidden.value && hidden.value.startsWith('data:image')) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img,0,0,canvas.width,canvas.height);
      img.src = hidden.value;
    }
  });
}

function clearSig(canvasId) {
  const c = document.getElementById(canvasId); const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
  c.dataset.dirty = '';
  const h = document.getElementById(canvasId.replace('_canvas','_hidden')); if (h) h.value = '';
}

function loadSig(canvasId, dataUrl) {
  const c = document.getElementById(canvasId); const ctx = c.getContext('2d');
  const img = new Image();
  img.onload = () => { ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); c.dataset.dirty='1'; };
  img.src = dataUrl;
  const h = document.getElementById(canvasId.replace('_canvas','_hidden')); if (h) h.value = dataUrl;
}

/* ------- File to Base64 ------- */
function fileToBase64(file) {
  return new Promise((resolve,reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ------- Simpan Data ------- */
async function saveForm() {
  const sheet = state.current;
  const body = $('#modalBody');
  const saveBtn = document.querySelector('[data-testid="save-btn"]');
  saveBtn.disabled = true; 
  const oldTxt = saveBtn.innerHTML; 
  saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

  // Capture signature canvases -> hidden input
  body.querySelectorAll('canvas[data-signature="1"]').forEach(c => {
    if (c.dataset.dirty === '1') {
      const h = document.getElementById(c.id.replace('_canvas','_hidden'));
      if (h) h.value = c.toDataURL('image/png');
    }
  });

  // Upload files -> hidden input URL
  const fileInputs = body.querySelectorAll('input[data-upload="1"]');
  try {
    for (const fi of fileInputs) {
      if (fi.files && fi.files[0]) {
        const f = fi.files[0];
        const b64 = await fileToBase64(f);
        const up = await apiPost({ action:'upload', filename: f.name, mimeType: f.type, base64: b64 });
        if (!up.ok) throw new Error(up.msg||'Upload gagal');
        const hidden = document.getElementById(fi.id + '_hidden'); if (hidden) hidden.value = up.url;
      }
    }
  } catch(err) { 
    saveBtn.disabled = false; 
    saveBtn.innerHTML = oldTxt; 
    toast('Gagal upload: '+err.message,'error'); 
    return; 
  }

  const inputs = body.querySelectorAll('input,select,textarea');
  const data = {};
  inputs.forEach(el => {
    const name = el.name; if (!name) return;
    if (el.type === 'file') return;
    if (el.value !== '') data[name] = el.value;
  });

  try {
    const payload = state.editingRow
      ? { action:'update', sheet, row: state.editingRow, data }
      : { action:'create', sheet, data };
    const res = await apiPost(payload);
    if (!res.ok) throw new Error(res.msg||'Gagal simpan');
    
    toast(state.editingRow ? 'Berhasil diperbarui' : 'Berhasil ditambahkan');
    closeForm();
    delete state.cache[sheet];
    refreshCurrent();
  } catch(err) { 
    toast(err.message, 'error'); 
  } finally { 
    saveBtn.disabled = false; 
    saveBtn.innerHTML = oldTxt; 
  }
}

async function delRow(row) {
  if (!confirm('Yakin ingin menghapus data ini? Aksi ini tidak bisa dibatalkan.')) return;
  try {
    const res = await apiPost({ action:'delete', sheet: state.current, row });
    if (!res.ok) throw new Error(res.msg);
    toast('Data dihapus');
    delete state.cache[state.current];
    refreshCurrent();
  } catch(err) { toast(err.message, 'error'); }
}

/* ------- Export ------- */
function exportXlsx() {
  const sheet = state.current;
  const headers = (state.schema[sheet]||[]).filter(h => h !== 'PasswordHash');
  const rows = state.data.map(r => headers.map(h => {
    const v = r[h]; if (v instanceof Date) return fmtDate(v);
    if (typeof v==='string' && /^\d{4}-\d{2}-\d{2}T/.test(v)) return fmtDate(new Date(v));
    return v==null?'':v;
  }));
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheet);
  XLSX.writeFile(wb, `HSE_${sheet}_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel diunduh');
}

function exportPdf() {
  const sheet = state.current;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape' });
  const headers = (state.schema[sheet]||[]).filter(h => h !== 'PasswordHash');
  const rows = state.data.map(r => headers.map(h => {
    const v = r[h]; if (v instanceof Date) return fmtDate(v);
    if (typeof v==='string' && /^\d{4}-\d{2}-\d{2}T/.test(v)) return fmtDate(new Date(v));
    return v==null?'':String(v);
  }));
  doc.setFontSize(14); doc.setTextColor(30,64,175); doc.text(`Laporan HSE - ${findModule(sheet)?.label||sheet}`, 14, 15);
  doc.setFontSize(9); doc.setTextColor(100); doc.text(`Digenerate: ${new Date().toLocaleString('id-ID')} • Oleh: ${state.user.name}`, 14, 21);
  doc.autoTable({ head:[headers], body:rows, startY:25, styles:{fontSize:7,cellPadding:2}, headStyles:{fillColor:[30,64,175],textColor:255}, alternateRowStyles:{fillColor:[248,250,252]} });
  doc.save(`HSE_${sheet}_${new Date().toISOString().slice(0,10)}.pdf`);
  toast('PDF diunduh');
}

/* ------- Auto login ------- */
(async () => {
  const saved = localStorage.getItem('hse_user');
  if (saved && !BACKEND_URL.includes('PASTE_WEB_APP_URL')) {
    try { state.user = JSON.parse(saved); await bootApp(); } catch(e){ logout(); }
  }
})();
