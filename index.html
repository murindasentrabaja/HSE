<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP HSE — PT Murinda Sentra Baja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --navy:#0F1B2D; --navy-2:#16253C; --steel:#3A4A63;
  --bg:#EEF2F7; --card:#FFFFFF; --line:#E3E8F0;
  --ink:#16202E; --muted:#67758C;
  --orange:#FF6B35; --orange-dk:#E24E17;
  --blue:#3B82F6; --purple:#8B5CF6; --red:#EF4444; --amber:#F59E0B;
  --green:#10B981; --teal:#14B8A6; --indigo:#6366F1;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px -12px rgba(16,24,40,.15);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.brand,.stat-num,.group-title{font-family:'Plus Jakarta Sans',sans-serif;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#C6CFDC;border-radius:8px;}

/* ---------- LOGIN ---------- */
#loginScreen{position:fixed;inset:0;overflow:hidden;background:linear-gradient(135deg,rgba(9,17,30,.97) 0%,rgba(22,37,60,.94) 50%,rgba(226,78,23,.90) 150%);display:flex;align-items:center;justify-content:center;z-index:200;}
#loginScreen .hse-stripes{position:absolute;inset:-10%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 26px,transparent 26px 52px);pointer-events:none;}
#loginScreen .hse-glow{position:absolute;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,53,.38),transparent 70%);top:-180px;right:-160px;pointer-events:none;filter:blur(6px);}
#loginScreen .hse-glow.two{background:radial-gradient(circle,rgba(59,130,246,.25),transparent 70%);top:auto;right:auto;bottom:-200px;left:-160px;}
#loginScreen .hse-watermark{position:absolute;color:rgba(255,255,255,.055);pointer-events:none;line-height:1;}
.login-card{position:relative;z-index:2;width:400px;max-width:90vw;background:rgba(255,255,255,.98);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:0 0 34px;box-shadow:0 35px 70px -25px rgba(0,0,0,.5);overflow:hidden;}
.login-card .hazard-bar{height:6px;width:100%;background:repeating-linear-gradient(-45deg,var(--orange) 0 10px,var(--navy) 10px 20px);}
.login-card .login-inner{padding:32px 34px 0;}
.login-brand{text-align:center;margin-bottom:20px;}
.login-logo{max-width:130px;max-height:60px;width:auto;height:auto;object-fit:contain;margin-bottom:14px;}
.login-card h1{font-size:20px;margin:0 0 3px;text-align:center;letter-spacing:.1px;}
.brand-co{margin:0;font-size:12.5px;font-weight:700;color:var(--orange-dk);text-align:center;letter-spacing:.3px;text-transform:uppercase;}
.login-card p.sub{color:var(--muted);margin:10px 0 26px;font-size:12.5px;text-align:center;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--steel);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#FBFCFE;transition:.15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px rgba(255,107,53,.15);}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;transition:.15s;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:hover{background:var(--orange-dk);}
.btn-block{width:100%;padding:12px;}
#loginError{color:var(--red);font-size:12.5px;margin-top:4px;min-height:16px;}

/* ---------- APP SHELL ---------- */
#app{display:none;height:100vh;}
.shell{display:flex;height:100%;}
.sidebar{width:264px;flex:none;background:var(--navy);color:#CBD5E4;display:flex;flex-direction:column;height:100%;}
.brand{border-bottom:1px solid rgba(255,255,255,.08);}
.brand-lockup{display:flex;align-items:center;gap:10px;}
.brand-logo-box{width:42px;height:42px;flex:none;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:5px;}
.brand-logo-box img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
.brand-text{display:flex;flex-direction:column;line-height:1.3;min-width:0;}
.brand-text strong{color:#fff;font-size:14.5px;font-weight:800;letter-spacing:.2px;}
.brand-text span{color:#93A2BB;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav{flex:1;overflow-y:auto;padding:12px 10px;}
.nav-group{margin-bottom:6px;}
.nav-group-head{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;font-size:13px;font-weight:600;color:#DCE4F0;}
.nav-group-head .gicon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex:none;}
.nav-group-head i.chev{margin-left:auto;font-size:10px;transition:.15s;color:#7C8BA6;}
.nav-group.open .nav-group-head i.chev{transform:rotate(90deg);}
.nav-group-head:hover{background:rgba(255,255,255,.05);cursor:pointer;}
.nav-items{max-height:0;overflow:hidden;transition:max-height .2s ease;}
.nav-group.open .nav-items{max-height:600px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 44px;font-size:13px;border-radius:8px;color:#B8C4D9;}
.nav-item i{width:14px;font-size:11px;color:#7C8BA6;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(255,107,53,.18);color:#FFD8C4;font-weight:600;}
.nav-item.active i{color:var(--orange);}
.nav-dash{margin:4px 4px 10px;}
.nav-dash .nav-item{padding-left:14px;border-radius:10px;font-weight:600;}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);}
.user-chip{display:flex;align-items:center;gap:10px;}
.user-chip .av{width:32px;height:32px;border-radius:50%;background:var(--steel);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex:none;}
.user-chip .u strong{display:block;font-size:12.5px;color:#fff;}
.user-chip .u span{font-size:11px;color:#93A2BB;}
.logout-btn{margin-top:10px;width:100%;background:rgba(255,255,255,.06);color:#DCE4F0;font-size:12.5px;padding:8px;border-radius:8px;}
.logout-btn:hover{background:rgba(239,68,68,.25);color:#fff;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden;}
.topbar{height:64px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px;}
.topbar h2{margin:0;font-size:17px;}
.topbar .path{font-size:12px;color:var(--muted);margin-top:1px;}
.search-global{margin-left:auto;position:relative;width:260px;}
.search-global input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;background:var(--bg);}
.search-global i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;}
.content{flex:1;overflow-y:auto;padding:22px 26px 40px;}

/* ---------- MODERN LOADER ---------- */
.modern-loader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:18px;color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.2px;}
.modern-loader{position:relative;width:56px;height:56px;}
.modern-loader::before,.modern-loader::after{content:'';position:absolute;inset:0;border-radius:50%;}
.modern-loader::before{background:conic-gradient(from 0deg,var(--orange) 0deg,var(--purple) 120deg,var(--blue) 210deg,var(--teal) 300deg,var(--orange) 360deg);animation:loaderSpin 1s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 6px));}
.modern-loader::after{inset:16px;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;animation:loaderPulse 1s ease-in-out infinite;}
@keyframes loaderSpin{to{transform:rotate(360deg);}}
@keyframes loaderPulse{0%,100%{transform:scale(.82);opacity:.85;}50%{transform:scale(1);opacity:1;}}

/* ---------- DASHBOARD ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
.stat-card{background:var(--card);border-radius:16px;padding:18px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;}
.stat-card .top{display:flex;align-items:center;justify-content:space-between;}
.stat-card .icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
.stat-num{font-size:26px;font-weight:800;}
.stat-label{font-size:12.5px;color:var(--muted);font-weight:600;}
.chart-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
.panel{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);}
.panel h3{margin:0 0 14px;font-size:14.5px;}
.panel canvas{max-height:260px;}

/* ---------- TABLE VIEW ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.toolbar .search-box{position:relative;width:250px;}
.toolbar .search-box input{width:100%;padding:9px 12px 9px 32px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;background:#fff;}
.toolbar .search-box i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;}
.toolbar select.date-filter, .toolbar input.date-filter{padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;background:#fff;}
.spacer{flex:1;}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--steel);}
.btn-ghost:hover{border-color:var(--orange);color:var(--orange-dk);}
.btn-sm{padding:8px 12px;font-size:12.5px;}
.btn-icon{width:34px;height:34px;padding:0;border-radius:9px;}

.table-wrap{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
table.data-table thead th{background:#F5F7FB;text-align:left;padding:12px 14px;font-size:11.5px;font-weight:700;color:var(--steel);white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;}
table.data-table tbody td{padding:11px 14px;border-bottom:1px solid #F0F2F7;color:var(--ink);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background-color 0.2s ease;}

/* OVERLAY HOVER & CLICK PADA ROW DATA */
table.data-table tbody tr.clickable-row td {
  cursor: pointer;
}
table.data-table tbody tr.clickable-row:hover td {
  background-color: rgba(255, 107, 53, 0.08) !important;
}
table.data-table tbody tr.clickable-row:active td {
  background-color: rgba(255, 107, 53, 0.18) !important;
  transition: background-color 0s;
}

.table-scroll{max-height:calc(100vh - 300px);overflow:auto;}
.badge{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:#DFF7EC;color:#0B815A;}
.badge-red{background:#FCE7E7;color:#C0221E;}
.badge-amber{background:#FEF3D6;color:#9A6700;}
.badge-blue{background:#E2ECFE;color:#1D4ED8;}
.badge-grey{background:#EEF1F6;color:#5B6B85;}
.row-actions{display:flex;gap:6px;}
.icon-btn{width:28px;height:28px;border:none;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
.icon-btn.edit{background:var(--blue);}
.icon-btn.del{background:var(--red);}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-state i{font-size:34px;margin-bottom:10px;color:#C9D2E0;}
.pagination{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);}
.pagination button{width:30px;height:30px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-size:12px;}
.pagination button.active{background:var(--orange);color:#fff;border-color:var(--orange);}
.pagination span{font-size:12px;color:var(--muted);margin-right:8px;}

/* ---------- MODAL OVERLAY ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,27,45,.55);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:150;padding:40px 16px;overflow-y:auto;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:18px;width:640px;max-width:100%;box-shadow:0 30px 70px -25px rgba(0,0,0,.45);animation:pop .16s ease;}
@keyframes pop{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:15.5px;}
.modal-head button{margin-left:auto;background:none;border:none;font-size:16px;color:var(--muted);width:30px;height:30px;border-radius:8px;}
.modal-head button:hover{background:var(--bg);}
.modal-body{padding:20px 22px;max-height:64vh;overflow-y:auto;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
.form-grid .full{grid-column:1/-1;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}
.confirm-modal{width:380px;text-align:center;padding:30px 26px;}
.confirm-modal i{font-size:34px;color:var(--red);margin-bottom:10px;}
.confirm-modal h3{margin:0 0 6px;font-size:16px;}
.confirm-modal p{color:var(--muted);font-size:13px;margin:0 0 20px;}
.confirm-actions{display:flex;gap:10px;justify-content:center;}

.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 18px;border-radius:11px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 15px 30px -10px rgba(0,0,0,.4);z-index:300;opacity:0;transform:translateY(8px);transition:.2s;}
.toast.show{opacity:1;transform:translateY(0);}
.toast i{color:var(--green);}
.toast.err i{color:var(--red);}

/* ---------- FILTER PANEL ---------- */
.filter-wrap{position:relative;}
.btn-filter.active{background:var(--orange);color:#fff;border-color:var(--orange);}
.filter-count{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:20px;background:#fff;color:var(--orange-dk);font-size:10px;font-weight:800;margin-left:2px;}
.btn-filter.active .filter-count{background:rgba(255,255,255,.9);}
.filter-panel{position:absolute;top:calc(100% + 8px);left:0;width:560px;max-width:80vw;background:#fff;border-radius:14px;box-shadow:0 20px 45px -18px rgba(16,24,40,.35);border:1px solid var(--line);padding:16px;display:none;z-index:60;}
.filter-panel.show{display:block;}
.filter-panel-inner{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.filter-field label{display:block;font-size:11.5px;font-weight:700;color:var(--steel);margin-bottom:5px;}
.filter-field select,.filter-field input{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;background:#FBFCFE;}
.filter-panel-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.filter-empty{color:var(--muted);font-size:12.5px;grid-column:1/-1;padding:6px 0;}

/* ---------- LOCKED FIELDS ---------- */
.field.locked input,.field.locked select,.field.locked textarea{background:#F1F3F8;color:var(--muted);cursor:not-allowed;}
.field .lock-tag{font-size:10.5px;font-weight:700;color:var(--muted);margin-left:6px;}
.readonly-banner{display:flex;align-items:center;gap:8px;background:#FEF3D6;color:#8A6300;border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:14px;font-weight:600;}

/* ---------- FK SELECT (relasi antar sheet) ---------- */
.field select[multiple]{height:120px;}
.field .hint{font-size:11px;color:var(--muted);margin-top:5px;}
.field .lock-tag.auto{color:var(--orange-dk,#c2540c);}

/* ---------- PRINT REPORT ---------- */
.print-header{display:none;}
tr.clickable-row{cursor:pointer;}

@media print{
  .sidebar,.topbar,.toolbar,.pagination,.overlay,.filter-panel{display:none !important;}
  .content{overflow:visible;padding:0;}
  .table-scroll{max-height:none;overflow:visible;}
  body{background:#fff;}
  .print-header{display:block !important;margin-bottom:16px;}
  .print-header .ph-top{display:flex;align-items:center;gap:12px;border-bottom:2px solid #16202E;padding-bottom:10px;margin-bottom:10px;}
  .print-header .ph-logo-img{height:44px;width:auto;max-width:150px;object-fit:contain;}
  .print-header .ph-co strong{display:block;font-size:15px;}
  .print-header .ph-co span{font-size:11px;color:#555;}
  .print-header h2{margin:2px 0 8px;font-size:16px;}
  .print-header .ph-meta{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:11px;color:#333;margin-bottom:4px;}
  .print-header .ph-filter{font-size:11px;color:#555;font-style:italic;}
  table.data-table{font-size:10.5px;}
  .row-actions{display:none !important;}
  table.data-table thead th:last-child, table.data-table tbody td:last-child{display:none;}
}
@media (max-width:900px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .chart-grid{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:-264px;z-index:120;transition:.2s;}
  .sidebar.open{left:0;}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="hse-stripes"></div>
  <div class="hse-glow"></div>
  <div class="hse-glow two"></div>
  <i class="fa-solid fa-hard-hat hse-watermark" style="font-size:260px;top:-40px;left:-60px;transform:rotate(-12deg);"></i>
  <i class="fa-solid fa-shield-halved hse-watermark" style="font-size:200px;bottom:-60px;right:-40px;transform:rotate(10deg);"></i>
  <i class="fa-solid fa-leaf hse-watermark" style="font-size:140px;bottom:30px;left:70px;transform:rotate(-8deg);"></i>
  <i class="fa-solid fa-truck-medical hse-watermark" style="font-size:110px;top:60px;right:90px;transform:rotate(8deg);"></i>
  <div class="login-card">
    <div class="hazard-bar"></div>
    <div class="login-inner">
      <div class="login-brand">
        <img src="MSB_Logo.png" alt="PT Murinda Sentra Baja" class="login-logo">
        <h1>ERP HSE System</h1>
        <p class="brand-co">PT Murinda Sentra Baja</p>
      </div>
      <p class="sub">Health, Safety & Environment Management System</p>
      <div class="field">
        <label>Username</label>
        <select id="loginUser">
          <option value="">Memuat user...</option>
        </select>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Masukkan password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
      <div id="loginError"></div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand" style="padding: 16px 18px;">
        <div class="brand-lockup">
          <div class="brand-logo-box"><img src="MSB_Logo.png" alt="Logo PT Murinda Sentra Baja" id="sidebarLogoImg"></div>
          <div class="brand-text">
            <strong>ERP HSE</strong>
            <span>PT Murinda Sentra Baja</span>
          </div>
        </div>
      </div>
      <div class="nav" id="navContainer"></div>
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="av" id="userAvatar">-</div>
          <div class="u"><strong id="userName">-</strong><span id="userRole">-</span></div>
        </div>
        <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-power-off"></i> Keluar</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <button class="btn-icon btn-ghost" id="burgerBtn" style="display:none;"><i class="fa-solid fa-bars"></i></button>
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <div class="path" id="pagePath">Ringkasan performa HSE</div>
        </div>

async function apiGet(action, params={}){
  const usp = new URLSearchParams({action, ...params});

  return res.json();
}
async function apiPost(payload){

  });

/* ---------------- MASTER DATA CACHE (untuk dropdown relasi FK) ----------------
   Memakai sheetDataCache yang sama dengan tampilan tabel, supaya sheet yang
   sudah pernah dibuka lewat menu tidak perlu di-fetch ulang untuk dropdown. */
let masterLoadPromises = {};
function loadMaster(sheetName){
  if(sheetDataCache[sheetName]) return Promise.resolve(sheetDataCache[sheetName]);
  if(masterLoadPromises[sheetName]) return masterLoadPromises[sheetName];
  masterLoadPromises[sheetName] = apiGet('list', {sheet: sheetName}).then(res=>{
    sheetDataCache[sheetName] = (res.ok && res.data) ? res.data : [];
    return sheetDataCache[sheetName];
  }).catch(()=>{ sheetDataCache[sheetName] = []; return []; });
  return masterLoadPromises[sheetName];
}
async function preloadAllMasters(){
  // Satu kali panggilan borongan (action 'masters') supaya dropdown langsung
  // siap begitu form dibuka. Kalau backend belum di-update, gagal diam-diam
  // dan tiap form akan lazy-load sheet yang dibutuhkannya sendiri.
  try{
    const res = await apiGet('masters');
    if(res.ok && res.data){
      Object.keys(res.data).forEach(k=>{ if(!sheetDataCache[k]) sheetDataCache[k] = res.data[k]; });
    }
  }catch(e){ /* diamkan */ }
}
function cssEsc(s){ return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g,'\\$&'); }

function fkOptionsFor(cfg){
  const rows = sheetDataCache[cfg.sheet] || [];
  return rows.map(r=>{
    const val = String(r[cfg.value] ?? '').trim();
    let lbl;
    if(cfg.showCode && cfg.label) lbl = `${val} — ${String(r[cfg.label] ?? '').trim()}`;
    else if(cfg.label) lbl = String(r[cfg.label] ?? '').trim();
    else lbl = val;
    return { value: val, label: lbl || val };
  }).filter(o=>o.value!=='');
}
function areaDeptGroups(){
  const areas = (sheetDataCache['Master_AreaKerja']||[]).map(r=>String(r['Nama Area']??'').trim()).filter(Boolean);
  const depts = (sheetDataCache['Master_Departemen']||[]).map(r=>String(r['Nama_Departemen']??'').trim()).filter(Boolean);
  return [ {label:'Area Kerja', items:areas}, {label:'Departemen', items:depts} ];
}
function insidenOptions(){
  const rows = sheetDataCache['Insiden_Kecelakaan']||[];
  return rows.map(r=>{
    const val = String(r['No Laporan']??'').trim();
    const lbl = `${val} — ${r['Nama Korban']||'-'} (${r['Tanggal Kejadian']||'-'})`;
    return { value: val, label: lbl };
  }).filter(o=>o.value!=='');
}
function fkNeededSheets(key){
  const fkMap = FK_CONFIG[key] || {};
  const needed = new Set();
  Object.values(fkMap).forEach(cfg=>{
    if(cfg.virtual==='AreaDept'){ needed.add('Master_AreaKerja'); needed.add('Master_Departemen'); }
    else if(cfg.virtual==='Insiden'){ needed.add('Insiden_Kecelakaan'); }
    else if(cfg.sheet){ needed.add(cfg.sheet); }
  });
  return [...needed];
}
function renderFkInput(field, cfg, value){
  const fid = 'fk_'+sanitizeId(field);
  if(cfg.virtual==='AreaDept'){
    const groups = areaDeptGroups();
    const body = groups.map(g=>`<optgroup label="${escAttr(g.label)}">${g.items.map(v=>`<option value="${escAttr(v)}" ${String(value)===v?'selected':''}>${escHtml(v)}</option>`).join('')}</optgroup>`).join('');
    return `<select name="${escAttr(field)}" id="${fid}"><option value="">- pilih -</option>${body}</select>`;
  }
  const opts = cfg.virtual==='Insiden' ? insidenOptions() : fkOptionsFor(cfg);
  if(cfg.multi){
    const selected = String(value||'').split(',').map(s=>s.trim()).filter(Boolean);
    return `<select name="${escAttr(field)}" id="${fid}" multiple>
      ${opts.map(o=>`<option value="${escAttr(o.value)}" ${selected.includes(o.value)?'selected':''}>${escHtml(o.label)}</option>`).join('')}
    </select><div class="hint"><i class="fa-solid fa-circle-info"></i> Tahan Ctrl (Windows) / Cmd (Mac) untuk memilih lebih dari satu</div>`;
  }
  return `<select name="${escAttr(field)}" id="${fid}">
    <option value="">- pilih -</option>
    ${opts.map(o=>`<option value="${escAttr(o.value)}" ${String(value)===o.value?'selected':''}>${escHtml(o.label)}</option>`).join('')}
  </select>`;
}

/* ---------------- AUTO-FILL (field turunan dari FK di form yang sama) ---------------- */
const AUTO_FILL_RULES = {
  'Checklist Aset': { trigger:'Kode Alat', run(value, form){
    const row = (sheetDataCache['Master_Aset']||[]).find(r=>String(r['Kode Aset'])===value);
    const n = form.querySelector(`[name="${cssEsc('Nama Alat')}"]`);
    const k = form.querySelector(`[name="${cssEsc('Kategori')}"]`);
    if(n) n.value = row ? (row['Nama Aset']||'') : '';
    if(k) k.value = row ? (row['Kelompok']||'') : '';
  }},
  'DistribusiAPD': { trigger:'Jenis APD', run(value, form){
    const row = (sheetDataCache['Master_APD']||[]).find(r=>String(r['Nama APD'])===value);
    const masa = row ? Number(row['Masa Pakai (Bulan)']||0) : 0;
    const kad = form.querySelector(`[name="${cssEsc('Tanggal Kadaluarsa')}"]`);
    if(kad && masa>0){
      const tgl = form.querySelector(`[name="${cssEsc('Tanggal')}"]`);
      const base = (tgl && tgl.value) ? new Date(tgl.value) : new Date();
      base.setMonth(base.getMonth()+masa);
      kad.value = base.toISOString().slice(0,10);
    }
  }},
};
function wireAutoFill(key){
  const rule = AUTO_FILL_RULES[key];
  if(!rule) return;
  const form = document.getElementById('dataForm');
  const trg = form.querySelector(`[name="${cssEsc(rule.trigger)}"]`);
  if(trg) trg.addEventListener('change', ()=>rule.run(trg.value, form));
}

/* ---------------- LOGIN ---------------- */
document.getElementById('loginBtn').addEventListener('click', doLogin);

async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.textContent='';
  if(!u || !p){ errEl.textContent='Username dan password wajib diisi.'; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> Memeriksa...';
  try{
    const res = await apiGet('login', {username:u, password:p});
    if(res.ok){
      currentUser = res.user;
      sessionStorage.setItem('erp_hse_user', JSON.stringify(currentUser));
      enterApp();
    } else {
      errEl.textContent = res.message || 'Login gagal.';
    }
  } catch(e){
    errEl.textContent = 'Tidak dapat terhubung ke server. Periksa URL Apps Script.';
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk';
  }
}

function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userName').textContent = currentUser['Nama Lengkap'] || currentUser['Username'];
  document.getElementById('userRole').textContent = currentUser['Role'] || '';
  document.getElementById('userAvatar').textContent = (currentUser['Nama Lengkap']||currentUser['Username']||'?').substring(0,1).toUpperCase();
  ensureSchema();
  preloadAllMasters();
  buildSidebar();
  showDashboard();
}
document.getElementById('logoutBtn').addEventListener('click', ()=>{

  const saved = sessionStorage.getItem('erp_hse_user');
  if(saved){ currentUser = JSON.parse(saved); document.addEventListener('DOMContentLoaded', enterApp); }
  else { document.addEventListener('DOMContentLoaded', loadUsers); }
})();

let searchDebounce;
function onSearchInput(key){

function badgeFor(col, val){
  const v = String(val||'').toLowerCase();
  if(!v) return '';
  let cls = 'badge-grey';
  if(/baik|aktif|operasional|setuju|selesai|close|ya\b|lulus/.test(v)) cls='badge-green';
  else if(/rusak|tinggi|ekstrem|tidak|reject|tolak/.test(v)) cls='badge-red';
  else if(/sedang|proses|open|pending|menunggu/.test(v)) cls='badge-amber';
  else if(/rendah|baru|draft/.test(v)) cls='badge-blue';
  const badgeCols = /Status|Kondisi|Level Risiko|Hasil/i;
  if(badgeCols.test(col)) return `<span class="badge ${cls}">${val}</span>`;
  return null;
}

function renderTableBody(key, cols){
  const tbody = document.getElementById('tableBody');
  const start = (currentPage-1)*PAGE_SIZE;
  const pageRows = filteredRows.slice(start, start+PAGE_SIZE);
  const idField = ID_FIELD[key];
  const info = lockInfo(key);
  const rowIcon = info.mode==='locked' ? 'fa-eye' : 'fa-pen';
  if(pageRows.length===0){
    tbody.innerHTML = `<tr><td colspan="${cols.length+1}"><div class="empty-state"><i class="fa-solid fa-inbox"></i><div>Belum ada data</div></div></td></tr>`;
  } else {
    tbody.innerHTML = pageRows.map((row, idx)=>{
      const tds = cols.map(c=>{
        const b = badgeFor(c, row[c]);
        const val = row[c]===undefined||row[c]===null?'':row[c];
        return `<td title="${escAttr(String(val))}">${b || escHtml(String(val))}</td>`;
      }).join('');
      const rowId = idField ? row[idField] : row._row;
      const rowJson = JSON.stringify(row).replace(/'/g,"&#39;");
      const delBtn = canDelete(key) ? `<button class="icon-btn del" onclick="event.stopPropagation();askDelete('${escAttr(key)}','${escAttr(String(rowId))}')"><i class="fa-solid fa-trash"></i></button>` : '';
      return `<tr class="clickable-row" onclick='openFormModal("${escAttr(key)}", null, ${rowJson})'>${tds}<td><div class="row-actions">
        <button class="icon-btn edit" onclick='event.stopPropagation();openFormModal("${escAttr(key)}", null, ${rowJson})'><i class="fa-solid ${rowIcon}"></i></button>
        ${delBtn}
      </div></td></tr>`;
    }).join('');
  }
  renderPagination(key, cols);
}

function renderPagination(key, cols){
  const totalPages = Math.max(1, Math.ceil(filteredRows.length / PAGE_SIZE));
  const el = document.getElementById('pagination');
  let html = `<span>${filteredRows.length} data — hal ${currentPage}/${totalPages}</span>`;
  html += `<button ${currentPage<=1?'disabled':''} onclick="gotoPage(${currentPage-1},'${escAttr(key)}',${JSON.stringify(cols).replace(/"/g,'&quot;')})"><i class="fa-solid fa-chevron-left"></i></button>`;
  html += `<button ${currentPage>=totalPages?'disabled':''} onclick="gotoPage(${currentPage+1},'${escAttr(key)}',${JSON.stringify(cols).replace(/"/g,'&quot;')})"><i class="fa-solid fa-chevron-right"></i></button>`;
  el.innerHTML = html;
}
function gotoPage(p, key, cols){ currentPage = p; renderTableBody(key, cols); }

function sanitizeId(s){ return String(s).replace(/[^a-z0-9]/gi,'_'); }

function detectDateColumn(cols){
  return cols.find(c=>DATE_RE.test(c)) || null;
}
function detectCategoricalColumns(key, cols){
  const rows = sheetDataCache[key] || [];
  const idField = ID_FIELD[key];
  const priority = cols.filter(c=>/Status|Kondisi|Level Risiko|Hasil|Jenis|Kategori|Kelompok/i.test(c));
  const others = cols.filter(c=>!priority.includes(c));
  const candidates = [...priority, ...others].filter(c=>
    c!==idField && !TEXTAREA_RE.test(c) && !DATE_RE.test(c) && !TIME_RE.test(c));
  const result = [];
  for(const c of candidates){
    const vals = Array.from(new Set(rows.map(r=>String(r[c]||'').trim()).filter(v=>v!=='')));
    if(vals.length>=1 && vals.length<=15){ result.push({col:c, values:vals.sort()}); }
    if(result.length>=3) break;
  }
  return result;
}

function renderFilterPanel(key, cols){
  const panel = document.getElementById('filterPanel');
  const dateCol = detectDateColumn(cols);
  const catCols = detectCategoricalColumns(key, cols);
  if(!dateCol && catCols.length===0){
    panel.innerHTML = `<div class="filter-panel-inner"><div class="filter-empty">Tidak ada kolom yang cocok untuk difilter pada data ini — gunakan kotak pencarian.</div></div>`;
    return;
  }
  let html = '<div class="filter-panel-inner">';
  if(dateCol){
    html += `<div class="filter-field"><label>${dateCol} — Dari</label><input type="date" id="filterDateFrom"></div>
      <div class="filter-field"><label>${dateCol} — Sampai</label><input type="date" id="filterDateTo"></div>`;
  }
  catCols.forEach(cc=>{
    html += `<div class="filter-field"><label>${cc.col}</label><select id="filterSel_${sanitizeId(cc.col)}" data-col="${escAttr(cc.col)}">
      <option value="">Semua</option>
      ${cc.values.map(v=>`<option value="${escAttr(v)}">${escHtml(v)}</option>`).join('')}
    </select></div>`;
  });
  html += '</div><div class="filter-panel-actions">';
  html += `<button class="btn btn-ghost btn-sm" onclick="resetAdvancedFilter('${escAttr(key)}')">Reset</button>`;
  html += `<button class="btn btn-primary btn-sm" onclick="applyAdvancedFilter('${escAttr(key)}','${escAttr(dateCol||'')}')">Terapkan Filter</button>`;
  html += '</div>';
  panel.innerHTML = html;
}

function toggleFilterPanel(key){
  document.getElementById('filterPanel').classList.toggle('show');
}
document.addEventListener('click', function(e){
  const wrap = document.querySelector('.filter-wrap');
  if(wrap && !wrap.contains(e.target)) document.getElementById('filterPanel')?.classList.remove('show');
});

function applyAdvancedFilter(key, dateCol){
  const panel = document.getElementById('filterPanel');
  currentFilters = { search: document.getElementById('tblSearch').value.trim().toLowerCase() };
  const from = panel.querySelector('#filterDateFrom')?.value || '';
  const to = panel.querySelector('#filterDateTo')?.value || '';
  if(dateCol && (from||to)){ currentFilters.dateCol = dateCol; currentFilters.dateFrom = from; currentFilters.dateTo = to; }
  panel.querySelectorAll('select[data-col]').forEach(sel=>{
    if(sel.value) currentFilters[sel.dataset.col] = sel.value;
  });
  runFilters(key);
  panel.classList.remove('show');
}

function runFilters(key){
  const all = sheetDataCache[key] || [];
  let rows = all.slice();
  if(currentFilters.search){
    const q = currentFilters.search;
    rows = rows.filter(row=> Object.values(row).some(v=> String(v||'').toLowerCase().includes(q)));
  }
  if(currentFilters.dateCol){
    rows = rows.filter(row=>{
      const v = String(row[currentFilters.dateCol]||'');
      if(!v) return false;
      if(currentFilters.dateFrom && v < currentFilters.dateFrom) return false;
      if(currentFilters.dateTo && v > currentFilters.dateTo) return false;
      return true;
    });
  }
  Object.keys(currentFilters).forEach(k=>{
    if(['search','dateCol','dateFrom','dateTo'].includes(k)) return;
    rows = rows.filter(row=> String(row[k]||'')===currentFilters[k]);
  });
  filteredRows = rows;
  currentPage = 1;
  renderTableBody(key, getColumns(key));
  updateFilterBadge();
}

function updateFilterBadge(){
  const count = Object.keys(currentFilters).filter(k=> k!=='search' && currentFilters[k]).length
    + (currentFilters.dateCol ? -1 : 0);
  const activeCount = Object.entries(currentFilters).filter(([k,v])=> ['dateFrom','dateTo'].includes(k) ? !!v : (k!=='search' && k!=='dateCol' && !!v)).length;
  const btn = document.getElementById('btnFilterToggle');
  const badge = document.getElementById('filterCount');
  if(!btn) return;
  if(activeCount>0){ btn.classList.add('active'); badge.style.display='inline-flex'; badge.textContent = activeCount; }
  else { btn.classList.remove('active'); badge.style.display='none'; }
}

function applySheetFilter(key){
  currentFilters.search = document.getElementById('tblSearch').value.trim().toLowerCase();
  runFilters(key);
}
function clearSheetFilter(key){
  document.getElementById('tblSearch').value='';
  currentFilters = {};
  filteredRows = (sheetDataCache[key]||[]).slice();
  currentPage = 1;
  renderTableBody(key, getColumns(key));
  updateFilterBadge();
  const panel = document.getElementById('filterPanel');
  panel?.querySelectorAll('select[data-col]').forEach(s=>s.value='');
  const df = panel?.querySelector('#filterDateFrom'), dt = panel?.querySelector('#filterDateTo');
  if(df) df.value=''; if(dt) dt.value='';
}
function resetAdvancedFilter(key){ clearSheetFilter(key); document.getElementById('filterPanel').classList.remove('show'); }

function getFilterSummaryText(){
  const parts = [];
  if(currentFilters.search) parts.push(`kata kunci "${currentFilters.search}"`);
  if(currentFilters.dateCol && (currentFilters.dateFrom||currentFilters.dateTo)){
    parts.push(`${currentFilters.dateCol} ${currentFilters.dateFrom||'…'} s/d ${currentFilters.dateTo||'…'}`);
  }
  Object.keys(currentFilters).forEach(k=>{
    if(!['search','dateCol','dateFrom','dateTo'].includes(k) && currentFilters[k]) parts.push(`${k} = ${currentFilters[k]}`);
  });
  return parts.length ? parts.join('; ') : 'Tidak ada filter aktif (menampilkan seluruh data)';
}

/* ---------------- FORM MODAL (ADD/EDIT) ---------------- */
function findSheetLabel(key){
  for(const g of MENU) for(const s of g.sheets) if(s.key===key) return s.label;
  return key;
}
function fieldType(key, field){
  if(getFK(key, field)) return 'fk';
  if(TIME_RE.test(field)) return 'time';
  if(DATE_RE.test(field)) return 'date';
  if(SELECT_OPTIONS[field]) return 'select';
  if(TEXTAREA_RE.test(field)) return 'textarea';
  if(NUMBER_RE.test(field)) return 'number';
  return 'text';
}
async function openFormModal(key, labelIgnored, existingRow){
  await ensureSchema();
  const label = findSheetLabel(key);
  const cols = getColumns(key).length ? getColumns(key) : Object.keys(existingRow||{}).filter(k=>k!=='_row');
  const idField = ID_FIELD[key];
  const info = lockInfo(key);
  const isDetailOnly = existingRow && info.mode==='locked';
  const fkMap = FK_CONFIG[key] || {};
  const derivedFields = DERIVED_READONLY[key] || [];

  // Muat lebih dulu sheet master yang dibutuhkan field FK di form ini
  const needed = fkNeededSheets(key);
  if(needed.length) await Promise.all(needed.map(loadMaster));

  document.getElementById('formModalTitle').textContent = isDetailOnly ? `Detail ${label}` : (existingRow ? `Edit ${label}` : `Tambah ${label}`);
  const form = document.getElementById('dataForm');
  form.dataset.sheet = key;
  form.dataset.mode = existingRow ? 'edit' : 'create';
  form.dataset.id = existingRow && idField ? existingRow[idField] : '';
  form.innerHTML = cols.map(c=>{
    const type = fieldType(key, c);
    const value = existingRow ? (existingRow[c] ?? '') : '';
    const isId = c===idField;
    const isDerived = derivedFields.includes(c);
    const editable = (existingRow ? isFieldEditable(key, c) : true) && !isDerived;
    const locked = isId || !editable;
    const full = (type==='textarea' || (type==='fk' && fkMap[c] && fkMap[c].multi)) ? 'full' : '';
    let input;
    if(type==='fk' && editable && !isId){
      input = renderFkInput(c, fkMap[c], value);
    } else if(type==='select' && editable && !isId){
      input = `<select name="${escAttr(c)}">
        <option value="">- pilih -</option>
        ${SELECT_OPTIONS[c].map(o=>`<option value="${o}" ${String(value)===o?'selected':''}>${o}</option>`).join('')}
      </select>`;
    } else if(type==='textarea'){
      input = `<textarea name="${escAttr(c)}" rows="3" ${locked?'readonly':''}>${escHtml(String(value))}</textarea>`;
    } else {
      const inpType = (type==='date'&&!locked)?'date':(type==='time'&&!locked?'time':(type==='number'&&!locked?'number':'text'));
      input = `<input type="${inpType}" name="${escAttr(c)}" value="${escAttr(String(value))}" ${locked?'readonly':''} ${isId?'placeholder="Otomatis jika dikosongkan" ':''}>`;
    }
    const tag = isDerived ? '<span class="lock-tag auto"><i class="fa-solid fa-wand-magic-sparkles"></i> otomatis</span>'
      : (locked && !isId ? '<span class="lock-tag"><i class="fa-solid fa-lock"></i> terkunci</span>' : '');
    return `<div class="field ${full} ${locked?'locked':''}"><label>${c}${isId?' (ID)':''}${tag}</label>${input}</div>`;
  }).join('');
  document.getElementById('saveBtn').style.display = isDetailOnly ? 'none' : 'inline-flex';
  openModal('formOverlay');
  wireAutoFill(key);
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const form = document.getElementById('dataForm');
  const key = form.dataset.sheet, mode = form.dataset.mode, id = form.dataset.id;
  const data = {};
  new FormData(form).forEach((v,k)=>{
    // select multiple (field FK relasi banyak-nilai) menghasilkan beberapa
    // entri dengan name yang sama -> gabung jadi satu string dipisah koma
    data[k] = data.hasOwnProperty(k) ? (data[k] ? data[k] + ', ' + v : v) : v;
  });
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> Menyimpan...';
  try{
    let res;
    if(mode==='edit') res = await apiPost({action:'update', sheet:key, id, data});
    else res = await apiPost({action:'create', sheet:key, data});
    if(!res.ok) throw new Error(res.message);
    showToast(res.message || 'Berhasil disimpan', true);
    closeModal('formOverlay');
    const label = findSheetLabel(key);
    await openSheet(key, label);
  } catch(e){
    showToast(e.message || 'Gagal menyimpan data', false);
  } finally {
    btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-floppy-disk"></i> Simpan';
  }
});

function askDelete(key, id){
  deleteContext = {key, id};
  openModal('confirmOverlay');
}
document.getElementById('confirmDeleteBtn').addEventListener('click', async ()=>{

  const {key, id} = deleteContext;
  const btn = document.getElementById('confirmDeleteBtn');

  }
});

/* ---------------- EXPORT / PRINT ---------------- */
function getLogoDataUrl(){
  try{
    const img = document.getElementById('sidebarLogoImg');
    if(!img || !img.complete || !img.naturalWidth) return null;
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    return canvas.toDataURL('image/png');
  } catch(e){ return null; }
}
function exportExcel(key, label){
  const cols = getColumns(key);
  const rows = filteredRows.map(r=>{ const o={}; cols.forEach(c=>o[c]=r[c]); return o; });
  const ws = XLSX.utils.json_to_sheet(rows, {header: cols});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, label.substring(0,30));
  XLSX.writeFile(wb, `${label.replace(/[^a-z0-9]/gi,'_')}_${dateStamp()}.xlsx`);
}
function exportPDF(key, label){
  const cols = getColumns(key);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape'});
  const now = new Date();
  const pageW = doc.internal.pageSize.getWidth();
  doc.setFillColor(15,27,45);
  doc.rect(0,0,pageW,18,'F');
  doc.setFillColor(255,107,53);
  doc.rect(0,18,pageW,1.3,'F');
  const logoData = getLogoDataUrl();
  let textX = 12;
  if(logoData){
    try{
      const props = doc.getImageProperties(logoData);
      const logoH = 12, logoW = (props.width/props.height)*logoH;
      doc.addImage(logoData, props.fileType || 'PNG', 10, 3, logoW, logoH);
      textX = 10 + logoW + 6;
    } catch(e){ /* lanjut tanpa logo jika gagal dimuat */ }
  }
  doc.setTextColor(255,255,255);
  doc.setFontSize(12.5);
  doc.text('PT MURINDA SENTRA BAJA', textX, 9);
  doc.setFontSize(8.5);
  doc.text('Sistem ERP HSE — Health, Safety & Environment', textX, 14);
  doc.setTextColor(20,20,20);
  doc.setFontSize(12);
  doc.text(`Laporan: ${label}`, 12, 26);
  doc.setFontSize(8.5);
  doc.setTextColor(90,90,90);
  doc.text(`Dicetak oleh: ${(currentUser&&(currentUser['Nama Lengkap']||currentUser['Username']))||'-'}   |   Tanggal cetak: ${now.toLocaleDateString('id-ID')} ${now.toLocaleTimeString('id-ID')}   |   Total data: ${filteredRows.length}`, 12, 32);
  doc.text(`Filter aktif: ${getFilterSummaryText()}`, 12, 37);
  doc.autoTable({
    startY: 42,
    head: [cols],
    body: filteredRows.map(r=>cols.map(c=> r[c]===undefined||r[c]===null?'':String(r[c]))),
    styles:{ fontSize:7.5, cellPadding:2.2, lineColor:[225,229,236], lineWidth:0.2 },
    headStyles:{ fillColor:[15,27,45], textColor:255 },
    alternateRowStyles:{ fillColor:[247,249,252] },
    margin:{left:10,right:10}
  });
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(120,120,120);
    doc.text(`Halaman ${i} dari ${pageCount}`, doc.internal.pageSize.getWidth()-12, doc.internal.pageSize.getHeight()-6, {align:'right'});
  }
  doc.save(`${label.replace(/[^a-z0-9]/gi,'_')}_${dateStamp()}.pdf`);
}
function dateStamp(){ const d=new Date(); return d.toISOString().slice(0,10); }

/* ---------------- PRINT REPORT ---------------- */
function printReport(key, label){
  const now = new Date();
  const header = document.getElementById('printHeader');
  header.innerHTML = `
    <div class="ph-top">
      <img src="MSB_Logo.png" alt="PT Murinda Sentra Baja" class="ph-logo-img">
      <div class="ph-co"><strong>PT MURINDA SENTRA BAJA</strong><span>Sistem ERP HSE — Health, Safety & Environment</span></div>
    </div>
    <h2>Laporan: ${label}</h2>
    <div class="ph-meta">
      <span><b>Dicetak oleh:</b> ${escHtml(String((currentUser&&(currentUser['Nama Lengkap']||currentUser['Username']))||'-'))}</span>
      <span><b>Tanggal cetak:</b> ${now.toLocaleDateString('id-ID')} ${now.toLocaleTimeString('id-ID')}</span>
      <span><b>Total data:</b> ${filteredRows.length}</span>
    </div>
    <div class="ph-filter"><b>Filter aktif:</b> ${escHtml(getFilterSummaryText())}</div>`;
  setTimeout(()=>window.print(), 80);
}

/* ---------------- MODAL / TOAST / UTIL ---------------- */
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click', e=>{ if(e.target===ov) ov.classList.remove('show'); });
});
let toastTimer;
function showToast(msg, ok=true){
  const t = document.getElementById('toast');
  t.classList.toggle('err', !ok);
  document.getElementById('toastMsg').textContent = msg;
  t.querySelector('i').className = 'fa-solid ' + (ok?'fa-circle-check':'fa-circle-xmark');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
}
function escHtml(s){ return s.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function escAttr(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

/* responsive burger (mobile) */
if(window.innerWidth <= 900){
  document.getElementById('burgerBtn').style.display='inline-flex';
  document.getElementById('burgerBtn').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));
}
</script>
